# Publishes the package to PyPI via OIDC trusted publishing (no API token).
#
# Normally dispatched by the Release workflow after it pushes the release
# commit and tag. It can also be run manually to re-publish if it failed.
#
# One-time setup on PyPI (project 'anchorbrowser' -> Manage -> Publishing):
# add a "Trusted Publisher" for this GitHub repository with workflow name
# `publish-pypi.yml` (no environment).
name: Publish PyPI
on:
  workflow_dispatch:

  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    permissions:
      # required for PyPI OIDC trusted publishing
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Install Rye
        run: |
          curl -sSf https://rye.astral.sh/get | bash
          echo "$HOME/.rye/shims" >> $GITHUB_PATH
        env:
          RYE_VERSION: '0.44.0'
          RYE_INSTALL_OPTION: '--yes'

      - name: Build sdist and wheel
        run: rye build --clean

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
